# Builds, tests and packages the port on Windows, Linux and macOS (re/crossplatform.md, step 7).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The shared Qt: tests (the static one has no offscreen platform) and lrelease; MinGW 13.1.
      # Only what the build needs (qtbase: the libraries, plugins, *deployqt; qttools: lrelease; qttranslations:
      # qtbase_ru.qm, built into the exe): the full set is
      # 1.2 GB on macOS, and unpacking it took minutes on the Intel runner.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          archives: qtbase qttools qttranslations
          cache: true
      - uses: lukka/get-cmake@latest
      - name: MinGW of Qt first in PATH
        run: echo "$IQTA_TOOLS/mingw1310_64/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        # Git Bash puts its own /mingw64/bin first, whose libstdc++ and libwinpthread are not those of MinGW 13.1:
        # a test that imports what they lack does not start (under ctest: an error box nobody closes - a hang).
        run: PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH" ctest --test-dir build --output-on-failure
      # The single exe: a static qtbase, built once (~40 min) and then taken from the cache.
      - name: Static Qt from the cache
        id: static-qt
        uses: actions/cache@v4
        with:
          path: C:/qt-static
          key: qt-static-${{ env.QT_VERSION }}-mingw1310-${{ hashFiles('ci/windows/static-qt.sh') }}
      - name: Static Qt
        if: steps.static-qt.outputs.cache-hit != 'true'
        run: bash ci/windows/static-qt.sh C:/qt-static
      - name: Single exe
        run: |
          lrelease="$(cygpath -m "$QT_ROOT_DIR")/bin/lrelease.exe"
          # Only the static Qt: no trace of the shared one in the environment. The program -O2 (Release), Qt for
          # size: +0.45 MB against MinSizeRel, the core 25-45 % faster (re/perf.md, "Один exe").
          env -u Qt6_DIR -u QT_PLUGIN_PATH -u CMAKE_PREFIX_PATH \
            cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_PREFIX_PATH=C:/qt-static -DQt6_DIR=C:/qt-static/lib/cmake/Qt6 -DTS_LRELEASE="$lrelease" \
              -DTS_QT_TRANSLATIONS="$(cygpath -m "$QT_ROOT_DIR")/translations" \
              "-DCMAKE_CXX_FLAGS=-ffunction-sections -fdata-sections" "-DCMAKE_C_FLAGS=-ffunction-sections -fdata-sections" \
              "-DCMAKE_EXE_LINKER_FLAGS=-s -Wl,--gc-sections"
          cmake --build build-static --target TypingStatistics
          ls -l build-static/TypingStatistics.exe
          # Only DLLs of Windows itself.
          objdump -p build-static/TypingStatistics.exe | grep "DLL Name" | tee dlls.txt
          if grep -iE "qt6|libstdc|libgcc|libwinpthread" dlls.txt; then echo "not a single exe"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          path: build-static/TypingStatistics.exe
          archive: false

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC with the hardware 80-bit long double, and the package.
          - name: gcc
            cc: gcc
            cxx: g++
            options: ""
            package: true
          # Clang and the software 80-bit arithmetic of arm64 (tst_orig, tst_hist, tst_ext80 stay bit-exact).
          - name: clang-soft-ext80
            cc: clang
            cxx: clang++
            options: -DTS_SOFT_EXT80=ON
            package: false
    name: linux (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        timeout-minutes: 15
        run: |
          # The runner's Azure mirror sometimes does not answer: short timeouts, and apt goes on to the next mirror
          # of the list (archive.ubuntu.com) instead of waiting minutes on every file.
          echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libegl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbregistry-dev libxcb1-dev libxcb-xkb-dev xkb-data \
            fonts-liberation libxcb-cursor0 libfuse2
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          # icu: qtbase is linked to it; qtwayland: the Wayland plugin of the AppImage.
          archives: qtbase qttools qttranslations icu qtwayland
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_INSTALL_PREFIX=/usr -DTS_UDEV_RULES_DIR=/usr/lib/udev/rules.d ${{ matrix.options }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: AppImage
        if: matrix.package
        run: bash ci/linux/appimage.sh build
      # One file, not a zip (the udev rule is not needed: the program shows the command that writes it).
      - uses: actions/upload-artifact@v7
        if: matrix.package
        with:
          path: build/TypingStatistics-x86_64.AppImage
          archive: false

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # arm64: the software 80-bit arithmetic
            arch: arm64
          - runner: macos-15-intel  # x86_64: long double is x87
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    name: macos (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          archives: qtbase qttools qttranslations
          cache: true
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          macdeployqt build/TypingStatistics.app
          # Ad-hoc signature (arm64 runs only signed code). Not notarized: the first start is
          # "Open" from the context menu, or `xattr -dr com.apple.quarantine`.
          codesign --force --deep --sign - build/TypingStatistics.app
          # hdiutil sometimes fails on the runners with "Resource busy": try again.
          for i in 1 2 3 4; do
            hdiutil create -volname "Typing statistics" -srcfolder build/TypingStatistics.app -ov -format UDZO \
              build/TypingStatistics-macos-${{ matrix.arch }}.dmg && break
            [ "$i" = 4 ] && exit 1
            sleep 10
          done
      - uses: actions/upload-artifact@v7
        with:
          path: build/TypingStatistics-macos-${{ matrix.arch }}.dmg
          archive: false

  # A tag v* publishes a GitHub release with the files themselves (no zips): the single exe, the AppImage, the .dmg.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          Typing statistics — ремейк на Qt 6 для Windows, Linux и macOS.

          - **Windows** — `TypingStatistics.exe`: один файл, установка не нужна.
          - **Linux** — `TypingStatistics-x86_64.AppImage`: `chmod +x` и запустить; при первом запуске программа попросит
            разрешение видеть нажатия клавиш и даст команду, которую нужно один раз вставить в терминал.
          - **macOS** — `.dmg` для Apple Silicon (`arm64`) и Intel (`x86_64`). Программа не нотаризована: в первый раз —
            правый щелчок → «Открыть». Нужно разрешение «Мониторинг ввода».
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Typing statistics $GITHUB_REF_NAME" \
            --notes-file notes.md
